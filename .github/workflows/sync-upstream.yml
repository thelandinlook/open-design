name: Sync upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/nexu-io/open-design.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main."
          else
            git merge --no-edit upstream/main
            git push origin HEAD:main
          fi

      - name: Disable copied upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh workflow list --repo "$GITHUB_REPOSITORY" --all --limit 200 --json path,state \
            --jq '.[] | select(.path != ".github/workflows/sync-upstream.yml" and .state == "active") | .path' |
          while IFS= read -r workflow_path; do
            echo "Disabling $workflow_path"
            gh workflow disable "$workflow_path" --repo "$GITHUB_REPOSITORY"
          done
